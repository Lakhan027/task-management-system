name: Build, Push & Deploy

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/lakhan027/task-management

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}-backend:latest
            ${{ env.IMAGE_REPO }}-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_REPO }}-backend:cache
          cache-to: type=inline

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}-frontend:latest
            ${{ env.IMAGE_REPO }}-frontend:${{ github.sha }}

      - name: Deploy to server via SSH (pull & restart)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /path/to/deploy
            export BACKEND_IMAGE_TAG=${{ github.sha }}
            export FRONTEND_IMAGE_TAG=${{ github.sha }}
            docker-compose pull
            docker-compose up -d --no-deps backend frontend
            # Run migrations once (optional)
            docker-compose run --rm backend npx prisma migrate deploy